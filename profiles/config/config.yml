# Single source of truth for the profiles pipeline. Nothing below is hardcoded in code.

arcgis:
  service: https://services1.arcgis.com/taguadKoI1XFwivx/arcgis/rest/services/WFRC_Administrative_and_Planning_Area_Boundaries/FeatureServer
  # Only features from these organizations are used (MAG is deferred to a later phase).
  organizations: [WFRC]
  # geo_type -> layer. name_strip removes words from BoundaryName when building the geo_id slug.
  layers:
    aog: { layer: 0, label: Association of Governments, name_strip: [AOG] }
    mpo: { layer: 1, label: Metropolitan Planning Organization, name_strip: [MPO, Planning, Area] }
    rpo: { layer: 2, label: Rural Planning Organization, name_strip: [RPO] }
    fws: { layer: 5, label: Workshop Area, name_strip: ["Co."] }

tiger:
  # Vintage of the county polygons used to audit the custom boundaries.
  audit_year: 2023
  state: UT

audit:
  crs: "EPSG:32612"            # UTM 12N, metric, for area math
  equivalent_iou: 0.98         # a boundary this close to one county is treated as that county
  overlap_tolerance_m2: 10000  # ignore slivers smaller than this when checking overlaps
  min_county_overlap_km2: 1    # ignore county slivers smaller than this in the audit table

census:
  state_fips: "49"

acs:
  # 5-year end years. The latest is 2024 (2020-2024); trend vintages are added in a later phase.
  vintages: [2024]
  # Census geography -> the `for`/`in` clause used to pull the whole state at that level.
  geographies:
    state: { for: "state:49" }
    county: { for: "county:*", in: "state:49" }
    place: { for: "place:*", in: "state:49" }
    tract: { for: "tract:*", in: "state:49 county:*" }
    block_group: { for: "block group:*", in: "state:49 county:*" }
  # Whole tables are pulled (every estimate and margin of error). agg says how a table combines when
  # summing areas later: sum (counts, the default) or median (must be re-derived, never summed).
  # weight is the 2020/2010 Decennial block count used to split a block group between areas: pop
  # (people), hh (occupied housing units = households) or hu (housing units). custom: false keeps a
  # table out of allocation (workplace-based tables cannot be split by where people live).
  tables:
    B01001: { topic: population, label: Sex by age, weight: pop }
    B01002: { topic: population, label: Median age, agg: median }
    B02001: { topic: population, label: Race, weight: pop }
    B03003: { topic: population, label: Hispanic or Latino origin, weight: pop }
    B26001: { topic: population, label: Group quarters population, weight: pop }
    B11012: { topic: households, label: Households by type, weight: hh }
    B25003: { topic: households, label: Tenure, weight: hh }
    B25044: { topic: households, label: Tenure by vehicles available, weight: hh }
    B25002: { topic: housing, label: Occupancy status, weight: hu }
    B25024: { topic: housing, label: Units in structure, weight: hu }
    B25034: { topic: housing, label: Year structure built, weight: hu }
    B25064: { topic: housing, label: Median gross rent, agg: median }
    B25077: { topic: housing, label: Median home value, agg: median }
    B25070: { topic: housing, label: Gross rent as a share of income, weight: hh }
    B25091: { topic: housing, label: Owner costs as a share of income, weight: hh }
    B19001: { topic: income, label: Household income brackets, weight: hh }
    B19013: { topic: income, label: Median household income, agg: median }
    B17001: { topic: income, label: Poverty status, weight: pop }
    B15003: { topic: education, label: Educational attainment, weight: pop }
    B14001: { topic: education, label: School enrollment, weight: pop }
    B23025: { topic: employment, label: Employment status, weight: pop }
    B08301: { topic: commute, label: Means of transportation to work (by residence), weight: pop }
    B08303: { topic: commute, label: Travel time to work (by residence), weight: pop }
    B08601: { topic: commute, label: Means of transportation to work (by workplace), custom: false }
    B08603: { topic: commute, label: Travel time to work (by workplace), custom: false }
    B16001: { topic: social, label: Language spoken at home, weight: pop }
    B18101: { topic: social, label: Disability status, weight: pop }
    B28002: { topic: social, label: Internet subscriptions, weight: hh }

# Decennial block counts used as allocation weights. A 5-year ACS vintage uses the block group
# geography of its era: 2020 and later vintages use 2020 blocks, 2019 and earlier use 2010 blocks.
decennial:
  2020: { dataset: 2020/dec/pl, pop: P1_001N, hu: H1_001N, hh: H1_002N, tiger_year: 2020 }
  2010: { dataset: 2010/dec/sf1, pop: P001001, hu: H001001, hh: H003002, tiger_year: 2010 }

crosswalk:
  era_boundary: 2020           # ACS vintages >= this use the 2020 era, earlier ones the 2010 era
  whole_unit_share: 0.9999     # a block group at least this inside an area counts as whole
  equivalent_block_iou: 0.995  # an area whose blocks match one county's this closely is that county
  qa_tolerance: 0.005          # allowed relative gap in the crosswalk QA checks

[project]
name = "wfrcanalytics-github-io"
version = "0.1.0"
description = "Python tooling for wfrcanalytics.github.io (community profiles data pipeline)"
requires-python = ">=3.12"
dependencies = [
    # Pinned: this is the version whose spatial extension loads under the Windows Application Control policy
    # on WFRC machines (1.5.6 and 2.0.0 binaries were blocked). Bump deliberately and test LOAD spatial.
    "duckdb==1.5.4",
    "geopandas",
    "pandas",
    "pyarrow",
    "pygris",
    "python-dotenv",
    "pyyaml",
    "requests",
]

[dependency-groups]
dev = ["pytest"]

[project.scripts]
profiles = "wfrc_profiles.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["profiles/src/wfrc_profiles"]

[tool.pytest.ini_options]
testpaths = ["profiles/tests"]

[tool.uv]
link-mode = "copy"
